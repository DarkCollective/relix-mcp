// relix-mcp: an MCP server through which a language model checks Relix scripts.
//
// It depends on the engine exactly as any program outside the Relix repositories would:
// one published coordinate from Maven Central, reached through the packages its module
// descriptor exports. On develop that is the engine's snapshot, so a change merged to
// relix-core's develop is tried here before it is released; a release pins a released
// engine, and `engineIsReleased` refuses one that does not. The MCP SDK's jars carry an automatic module name the module
// system rejects (it has a hyphen), so this builds on the class path, where every package
// of a jar is readable; EngineBoundaryTest holds the compiled classes to the exported
// packages instead, reading the export list from the engine jar's own descriptor.

plugins {
    id 'application'
    // The one jar a function platform deploys: the server, the engine and the SDK together.
    id 'com.gradleup.shadow' version '9.4.3'
}

group = 'com.darkcollective.relix'
version = '1.0.0-rc2'

// develop tracks the engine's snapshot. Promoting to main pins a released engine here
// (-PrelixVersion=<release> tries one first); CI refuses a snapshot on main.
ext.relixVersion = (findProperty('relixVersion') ?: '1.0.0-rc12') as String
ext.relixIsSnapshot = relixVersion.endsWith('-SNAPSHOT')

repositories {
    mavenCentral()
    // Central's snapshot repository, looked in only while the engine is a snapshot.
    if (relixIsSnapshot) {
        maven {
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
            mavenContent { snapshotsOnly() }
        }
    }
}

// A snapshot is republished on every push to relix-core's develop; check for a newer one
// on each build rather than keeping a resolved one for Gradle's default day.
if (relixIsSnapshot) {
    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

// What CI runs for main: a release must not depend on an engine that can change under it.
tasks.register('engineIsReleased') {
    group = 'verification'
    description = 'Fails when the engine is a snapshot, as it must not be on main.'
    def engine = relixVersion
    doLast {
        if (engine.endsWith('-SNAPSHOT')) {
            throw new GradleException("The engine is ${engine}, a snapshot. A release pins a "
                    + "released engine: set relixVersion's default in build.gradle to one.")
        }
    }
}

java {
    toolchain {
        // The engine targets Java 21, the current LTS, and so does everything built on it.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation "com.darkcollective.relix:relix:${relixVersion}"
    // The language reference `learn` serves: published apart from the engine since rc8.
    implementation "com.darkcollective.relix:relix-docs:${relixVersion}"
    // The solver OPTIMIZE and COVER EXACT need. The engine finds it by ServiceLoader and
    // nothing requires it, so it is never pulled in transitively.
    runtimeOnly "com.darkcollective.relix:relix-solver-ojalgo:${relixVersion}"

    implementation platform('io.modelcontextprotocol.sdk:mcp-bom:2.0.1')
    implementation 'io.modelcontextprotocol.sdk:mcp'
    // The SDK logs through SLF4J; with no provider it warns on every start. Standard
    // output is the protocol's, so the server has nothing to say there anyway.
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
    // The interface AWS Lambda calls a Java handler through, and nothing else of AWS: the
    // API key is read through the Parameters and Secrets extension's local HTTP endpoint,
    // which needs no SDK in the jar.
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.darkcollective.relix.mcp.Main'
}

// The version the server reports, as a resource beside its classes. A manifest is read only
// from a jar, and AWS Lambda unpacks the deployment jar into loose classes, so the version
// travels as a classpath resource, which is found however the classes are laid out.
def versionResource = tasks.register('versionResource', WriteProperties) {
    destinationFile = layout.buildDirectory.file('generated/version/com/darkcollective/relix/mcp/version.properties')
    property('version', project.version.toString())
}
sourceSets.main.resources.srcDir(versionResource.map { layout.buildDirectory.dir('generated/version').get() })

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

tasks.named('check') {
    dependsOn tasks.named('javadoc')
}

test {
    useJUnitPlatform {
        excludeTags 'fat-jar'
    }
    systemProperty 'relix.mcp.version', project.version.toString()
    // DynamoDbDataStoreTest runs against DynamoDB Local when given its endpoint:
    // ./gradlew test -PdynamodbLocal=http://localhost:8000
    if (findProperty('dynamodbLocal')) {
        systemProperty 'relix.mcp.dynamodbLocal', findProperty('dynamodbLocal')
    }
}

// `relix-mcp-<version>-all.jar`: everything on the runtime class path in one jar, run with
// `java -jar`. The engine discovers its function library, connectors, solver and reference pages
// through ServiceLoader, so the META-INF/services files of every jar are concatenated
// rather than the first one winning: a lost entry is a missing provider at run time and
// nowhere earlier, which is why fatJarTest starts the jar and asks it to use each one.
tasks.named('shadowJar') {
    mergeServiceFiles()
    // Several jars carry a license and notice by the same name, under different licenses
    // (SLF4J's is MIT, Jackson's Apache 2.0), and each must travel with the jar. Joined,
    // every text is kept in the one entry a reader of the jar sees.
    append 'META-INF/LICENSE'
    append 'META-INF/LICENSE.txt'
    append 'META-INF/NOTICE'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // A module descriptor describes one jar; in a merged one it would describe the wrong
    // contents. Signatures cover a jar's own entries and are void once they are merged.
    exclude 'module-info.class', 'META-INF/versions/*/module-info.class',
            'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version)
    }
}

def fatJarTest = tasks.register('fatJarTest', Test) {
    description = 'Starts the fat jar over HTTP and calls every tool, so a provider lost in merging fails the build.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'fat-jar'
    }
    def jar = tasks.named('shadowJar').flatMap { it.archiveFile }
    inputs.file(jar)
    systemProperty 'relix.mcp.fatJar', jar.get().asFile.absolutePath
    systemProperty 'relix.mcp.version', project.version.toString()
    mustRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn fatJarTest
}

jar {
    manifest {
        attributes('Implementation-Title': project.name, 'Implementation-Version': project.version)
    }
}

// relix-mcp: an MCP server through which a language model checks Relix scripts.
//
// It depends on the engine exactly as any program outside the Relix repositories would:
// one released coordinate from Maven Central, reached through the packages its module
// descriptor exports. The MCP SDK's jars carry an automatic module name the module
// system rejects (it has a hyphen), so this builds on the class path, where every package
// of a jar is readable; EngineBoundaryTest holds the compiled classes to the exported
// packages instead, reading the export list from the engine jar's own descriptor.

plugins {
    id 'application'
    // The one jar a function platform deploys: the server, the engine and the SDK together.
    id 'com.gradleup.shadow' version '9.4.3'
}

group = 'com.darkcollective.relix'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        // The engine targets Java 21, the current LTS, and so does everything built on it.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext.relixVersion = (findProperty('relixVersion') ?: '1.0.0-rc4') as String

dependencies {
    implementation "com.darkcollective.relix:relix:${relixVersion}"

    implementation platform('io.modelcontextprotocol.sdk:mcp-bom:2.0.1')
    implementation 'io.modelcontextprotocol.sdk:mcp'
    // The SDK logs through SLF4J; with no provider it warns on every start. Standard
    // output is the protocol's, so the server has nothing to say there anyway.
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.darkcollective.relix.mcp.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

tasks.named('check') {
    dependsOn tasks.named('javadoc')
}

test {
    useJUnitPlatform {
        excludeTags 'fat-jar'
    }
}

// `relix-mcp-<version>-all.jar`: everything on the runtime class path in one jar, run with
// `java -jar`. The engine discovers its function library, connectors and reference pages
// through ServiceLoader, so the META-INF/services files of every jar are concatenated
// rather than the first one winning: a lost entry is a missing provider at run time and
// nowhere earlier, which is why fatJarTest starts the jar and asks it to use each one.
tasks.named('shadowJar') {
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // A module descriptor describes one jar; in a merged one it would describe the wrong
    // contents. Signatures cover a jar's own entries and are void once they are merged.
    exclude 'module-info.class', 'META-INF/versions/*/module-info.class',
            'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version)
    }
}

def fatJarTest = tasks.register('fatJarTest', Test) {
    description = 'Starts the fat jar over HTTP and calls every tool, so a provider lost in merging fails the build.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'fat-jar'
    }
    def jar = tasks.named('shadowJar').flatMap { it.archiveFile }
    inputs.file(jar)
    systemProperty 'relix.mcp.fatJar', jar.get().asFile.absolutePath
    mustRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn fatJarTest
}

jar {
    manifest {
        attributes('Implementation-Title': project.name, 'Implementation-Version': project.version)
    }
}
